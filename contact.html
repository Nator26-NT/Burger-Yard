<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0A">
    <title>The Burger Yard — Contact</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preload" href="images/Logo.png" as="image">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="loader" class="loader">
        <div class="loader-inner">
            <img src="images/Logo.png" alt="The Burger Yard" class="loader-logo">
            <div class="loader-bar"><span></span></div>
            <p class="loader-text">GOLD STANDARD</p>
        </div>
    </div>

    <div id="site-content" class="site-content">

        <header class="site-header">
            <div class="container header-inner">
                <a href="index.html" class="logo">
                    <img src="images/Logo.png" alt="The Burger Yard logo">
                    <span class="logo-text">BURGER <span>YARD</span></span>
                </a>
                <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
                <nav class="main-nav">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="menu.html">Menu</a></li>
                        <li><a href="contact.html" class="active">Contact</a></li>
                    </ul>
                </nav>
                <div class="header-actions">
                    <a href="contact.html" class="btn">Order Now</a>
                </div>
            </div>
        </header>

        <section class="contact-section">
            <div class="container">
                <h1 class="section-title">FIND US</h1>
                <div class="contact-grid">
                    <img class="contact-image" src="images/comtact.jpg" alt="The Burger Yard storefront">
                    <div class="contact-info">
                        <h2>VISIT US</h2>
                        <p><i class="fas fa-map-marker-alt"></i> 2154 Douglas Montseng, Vosloorus</p>
                        <p><i class="fas fa-phone-alt"></i> 067 861 5360</p>
                        <p><i class="fas fa-clock"></i> Mon–Sat: 10am – 7pm<br>&nbsp;&nbsp;&nbsp;&nbsp;Sun & Holidays: 10am – 5pm</p>
                        <p><i class="fas fa-motorcycle"></i> Delivery available</p>
                        <div class="social-links">
                            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                            <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                            <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="site-footer">
            <div class="container">
                <div class="logo-text">BURGER <span>YARD</span></div>
                <p class="footer-tag">EST. 2020 — GOLD STANDARD BURGERS</p>
                <div class="footer-social">
                    <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                    <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                    <a href="#" aria-label="Phone"><i class="fas fa-phone-alt"></i></a>
                </div>
                <p class="copyright">© The Burger Yard 2026 — All Rights Reserved</p>
            </div>
        </footer>

    </div>

    <script src="script.js"></script>
</body>

</html>
